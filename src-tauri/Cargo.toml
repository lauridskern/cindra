[package]
name = "agent_ui"
version = "0.1.0"
description = "Forge-backed Tauri chat prototype"
authors = ["Laurids"]
license = "UNLICENSED"
repository = "https://github.com/laurids/agent-ui"
edition = "2024"
rust-version = "1.94"
default-run = "agent_ui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "agent_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
diesel = { version = "2.3.7", features = ["sqlite"] }
futures = "0.3"
forge_api = { path = "../vendor/forgecode/crates/forge_api" }
forge_app = { path = "../vendor/forgecode/crates/forge_app" }
forge_config = { path = "../vendor/forgecode/crates/forge_config" }
forge_domain = { path = "../vendor/forgecode/crates/forge_domain" }
forge_infra = { path = "../vendor/forgecode/crates/forge_infra" }
forge_repo = { path = "../vendor/forgecode/crates/forge_repo" }
forge_services = { path = "../vendor/forgecode/crates/forge_services" }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "hickory-dns", "http2"] }
reqwest-eventsource = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
roxmltree = "0.20"
tauri = { version = "2.10.3", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tokio = { version = "1.51.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.14.5", features = ["tls-webpki-roots"] }
ts-rs = "12.0.1"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
